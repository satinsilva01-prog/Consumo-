name: Gerar APK ComBio Atual

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar aplicativo
        run: |
          mkdir -p apk-project/app/src/main/java/com/combio/energia
          mkdir -p apk-project/app/src/main/assets
          mkdir -p apk-project/app/src/main/res/values
          mkdir -p apk-project/app/src/main/res/drawable

          unzip -o ComBio_App_GitHub_APK.zip -d apk-project/temp

          find apk-project/temp -type f -name "index.html" -exec cp {} apk-project/app/src/main/assets/index.html \;

          if [ ! -f apk-project/app/src/main/assets/index.html ]; then
            echo "ERRO: index.html não encontrado no ZIP."
            exit 1
          fi

      - name: Criar configurações Gradle
        run: |
          cat > apk-project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ComBio"
          include ":app"
          EOF

          cat > apk-project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > apk-project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

      - name: Criar módulo Android e ícone
        run: |
          cat > apk-project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.combio.energia'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.combio.energia'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > apk-project/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#2E7D32</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > apk-project/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="80"
              android:viewportHeight="80">

              <path
                  android:fillColor="#087A43"
                  android:pathData="M39,69C18,60 8,40 18,14C36,16 49,27 53,44C55,57 47,66 39,69Z"/>

              <path
                  android:fillColor="#27B94A"
                  android:pathData="M42,69C44,44 57,23 72,12C79,40 68,61 42,69Z"/>

              <path
                  android:fillColor="#6BDC3C"
                  android:pathData="M39,69C39,49 45,31 60,18L57,22C47,35 42,50 42,69Z"/>
          </vector>
          EOF

          cat > apk-project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme"
                  android:label="ComBio Energia"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > apk-project/app/src/main/java/com/combio/energia/MainActivity.java <<'EOF'
          package com.combio.energia;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;

              private static final int FILE_CHOOSER = 1001;
              private static final int PERMISSIONS = 1002;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setGeolocationEnabled(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                              String origin,
                              GeolocationPermissions.Callback callback) {

                          callback.invoke(origin, true, false);
                      }

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {

                          runOnUiThread(() -> {
                              request.grant(request.getResources());
                          });
